<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Little iPhone</title>
<style>
:root{--accent:#8e9cf5;--wall:linear-gradient(145deg,#dce8ff,#fce1ed)}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#edf0f7;color:#222}
.phone{width:min(100%,430px);min-height:100dvh;margin:auto;padding:18px 16px 26px;background:var(--wall);position:relative;overflow:hidden}
.status{display:flex;justify-content:space-between;font-size:13px;font-weight:700;padding:3px 7px 15px}
.top{display:flex;align-items:center;justify-content:space-between;margin:8px 4px 22px}.top h1{font-size:25px;margin:0}.pill{border:0;border-radius:20px;padding:9px 13px;background:#ffffffb8;color:#333}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 10px}.app{border:0;background:transparent;text-align:center;color:#222;font:inherit;padding:0;min-width:0}.ico{width:58px;height:58px;border-radius:17px;background:#fff;display:grid;place-items:center;font-size:29px;margin:0 auto 6px;box-shadow:0 5px 14px #00000012}.app span{font-size:11px;text-shadow:0 1px 4px #fff}
.dock{position:sticky;bottom:8px;display:flex;justify-content:space-around;margin:30px 3px 0;padding:12px 5px;border-radius:26px;background:#ffffff9c;backdrop-filter:blur(15px)}
.panel{display:none;position:absolute;inset:0;background:#f7f7fb;z-index:5;padding:18px 16px 30px;overflow:auto}.panel.show{display:block}.panelhead{display:flex;align-items:center;gap:12px;margin:20px 0}.back{border:0;border-radius:14px;background:#e6e8f2;padding:10px 13px}.panel h2{margin:0;font-size:23px}.card{background:white;border-radius:17px;padding:14px;margin:10px 0;box-shadow:0 2px 10px #00000008}.muted{color:#777;font-size:13px}input,textarea,select{font:inherit;width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;margin:6px 0;background:white}textarea{min-height:100px;resize:vertical}button.primary{border:0;background:var(--accent);color:white;border-radius:12px;padding:11px 14px;font:inherit}button.small{border:0;background:#eceef6;border-radius:10px;padding:8px 10px}.listitem{padding:12px 2px;border-bottom:1px solid #eee;overflow-wrap:anywhere}.bubble{background:#e6eaff;padding:10px 13px;border-radius:16px;margin:8px 0;max-width:85%;overflow-wrap:anywhere}.bubble.me{background:#d4f5d7;margin-left:auto}.photo{width:100%;border-radius:12px;margin-top:8px}.wallchoice{height:48px;border-radius:12px;border:2px solid white;margin:5px}
</style>
</head>
<body>
<div class="phone" id="phone">
 <div class="status"><span>9:41</span><span>●●● ▰</span></div>
 <div class="top"><div><div class="muted" id="dateText">좋은 하루야 ☁️</div><h1 id="ownerTitle">My iPhone</h1></div><button class="pill" onclick="openApp('설정')">⚙️ 설정</button></div>
 <div class="grid" id="appGrid"></div>
 <div class="dock" id="dock"></div>
 <section class="panel" id="panel"><div class="panelhead"><button class="back" onclick="closeApp()">‹ 홈</button><h2 id="panelTitle">앱</h2></div><div id="panelBody"></div></section>
</div>
<script>
const defaults=[
 ['전화','📞'],['메시지','💬'],['카메라','📷'],['사진','🌄'],['카카오톡','🟡'],['네이버','🟢'],['유튜브','▶️'],['인스타그램','📸'],['메모','📝'],['일기','📔'],['캘린더','📅'],['미리 알림','☑️'],['Safari','🧭'],['음악','🎵'],['지도','🗺️'],['지갑','👛'],['디스코드','🎮'],['Pinterest','📌'],['음성 메모','🎙️'],['파일','📁'],['App Store','🅰️'],['설정','⚙️']
];
let data={owner:'My iPhone',accent:'#8e9cf5',wall:'linear-gradient(145deg,#dce8ff,#fce1ed)',notes:[],diary:'',messages:[],contacts:[],searches:[],videos:[],posts:[],reminders:[],photos:[],calls:[]};
try{const saved=localStorage.getItem('littlePhone');if(saved)data={...data,...JSON.parse(saved)}}catch(e){}
function save(){try{localStorage.setItem('littlePhone',JSON.stringify(data))}catch(e){}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderHome(){document.documentElement.style.setProperty('--accent',data.accent);document.getElementById('phone').style.background=data.wall;document.getElementById('ownerTitle').textContent=data.owner;document.getElementById('dateText').textContent=new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'});document.getElementById('appGrid').innerHTML=defaults.map(([n,i])=>`<button class="app" onclick="openApp('${n}')"><div class="ico">${i}</div><span>${n}</span></button>`).join('');document.getElementById('dock').innerHTML=['전화','메시지','Safari','사진'].map(n=>{let a=defaults.find(x=>x[0]===n);return `<button class="app" onclick="openApp('${n}')"><div class="ico">${a[1]}</div></button>`}).join('')}
function closeApp(){document.getElementById('panel').classList.remove('show')}
function openApp(name){document.getElementById('panelTitle').textContent=name;document.getElementById('panelBody').innerHTML=appContent(name);document.getElementById('panel').classList.add('show')}
function appContent(n){
 if(n==='설정')return `<div class="card"><b>프로필</b><input id="owner" value="${esc(data.owner)}" placeholder="아이폰 이름"><button class="primary" onclick="data.owner=document.getElementById('owner').value||'My iPhone';save();renderHome();alert('저장했어!')">이름 저장</button></div><div class="card"><b>테마 색상</b><div>${['#8e9cf5','#ff91b8','#7cc9ae','#f0b85c','#a88be8'].map(c=>`<button class="wallchoice" style="background:${c}" onclick="data.accent='${c}';save();renderHome()"></button>`).join('')}</div></div><div class="card"><b>배경화면</b><div>${[['linear-gradient(145deg,#dce8ff,#fce1ed)','파스텔'],['linear-gradient(145deg,#c8f7dc,#b4d8ff)','민트'],['linear-gradient(145deg,#ffd6a5,#fd9a9a)','노을'],['linear-gradient(145deg,#292b52,#8b7bb8)','밤하늘']].map(([c,l])=>`<button class="wallchoice" title="${l}" style="width:42%;background:${c}" onclick="data.wall='${c}';save();renderHome()">${l}</button>`).join('')}</div></div><div class="card"><button class="primary" onclick="downloadBackup()">백업 파일 저장</button> <label class="small">복원하기 <input type="file" accept=".json" onchange="restoreBackup(event)"></label></div>`;
 if(n==='네이버'||n==='Safari')return `<div class="card"><b>${n} 검색</b><input id="searchQ" placeholder="검색어를 입력해 봐" onkeydown="if(event.key==='Enter')doSearch('${n}')"><button class="primary" onclick="doSearch('${n}')">검색</button><p class="muted">검색 기록과 연관 검색어가 저장돼.</p><div id="suggest"></div></div><div class="card"><b>최근 검색 기록</b>${data.searches.map(s=>`<div class="listitem" onclick="document.getElementById('searchQ').value='${esc(s)}'">${esc(s)}</div>`).join('')||'<p class="muted">아직 검색 기록이 없어.</p>'}<button class="small" onclick="data.searches=[];save();openApp('${n}')">기록 지우기</button></div>`;
 if(n==='유튜브')return `<div class="card"><b>영상 검색</b><input id="videoQ" placeholder="보고 싶은 영상"><button class="primary" onclick="addVideo()">검색 기록 저장</button></div><div class="card"><b>시청/검색 기록</b>${data.videos.map(v=>`<div class="listitem">▶️ ${esc(v)}</div>`).join('')||'<p class="muted">아직 기록이 없어.</p>'}<button class="small" onclick="data.videos=[];save();openApp('유튜브')">기록 지우기</button></div>`;
 if(n==='카카오톡'||n==='메시지')return `<div class="card"><b>대화방 만들기</b><input id="chatName" placeholder="친구 이름"><button class="primary" onclick="makeChat()">대화방 추가</button></div><div id="chatList">${data.messages.map((m,i)=>`<div class="card"><b>${esc(m.name)}</b><div class="bubble">${esc(m.text||'대화를 시작해 봐!')}</div><input id="msg${i}" placeholder="메시지 입력"><button class="small" onclick="sendMsg(${i})">보내기</button></div>`).join('')}</div>`;
 if(n==='인스타그램'||n==='Pinterest')return `<div class="card"><b>게시물 만들기</b><textarea id="postText" placeholder="무슨 생각을 하고 있어?"></textarea><button class="primary" onclick="addPost()">게시</button></div>${data.posts.map(p=>`<div class="card"><b>@my_little_world</b><p>${esc(p)}</p>♡ 좋아요　♡ 댓글</div>`).join('')}`;
 if(n==='메모')return `<div class="card"><textarea id="noteText" placeholder="메모를 적어 봐"></textarea><button class="primary" onclick="addNote()">메모 저장</button></div>${data.notes.map((t,i)=>`<div class="card">${esc(t)}<button class="small" onclick="data.notes.splice(${i},1);save();openApp('메모')">삭제</button></div>`).join('')}`;
 if(n==='일기')return `<div class="card"><b>오늘의 일기</b><textarea id="diaryText" placeholder="오늘 있었던 일을 적어 봐">${esc(data.diary)}</textarea><button class="primary" onclick="data.diary=document.getElementById('diaryText').value;save();alert('일기 저장 완료!')">저장</button></div>`;
 if(n==='미리 알림'||n==='캘린더')return `<div class="card"><b>${n==='캘린더'?'일정':'할 일'} 추가</b><input id="remText" placeholder="내용"><input id="remDate" type="date"><button class="primary" onclick="addReminder()">추가</button></div>${data.reminders.map((r,i)=>`<div class="card">📅 ${esc(r.date)}　${esc(r.text)} <button class="small" onclick="data.reminders.splice(${i},1);save();openApp('${n}')">완료/삭제</button></div>`).join('')}`;
 if(n==='사진'||n==='카메라')return `<div class="card"><b>사진 앨범</b><p class="muted">사진을 선택하면 이 기기의 브라우저에 저장돼. (저장 용량에 제한이 있을 수 있어.)</p><input type="file" accept="image/*" multiple onchange="addPhotos(event)">${data.photos.map(p=>`<img class="photo" src="${p}" alt="내 사진">`).join('')}</div>`;
 if(n==='전화')return `<div class="card"><b>전화 기록 (가상)</b><input id="phoneNum" placeholder="이름 또는 전화번호"><button class="primary" onclick="data.calls.unshift(document.getElementById('phoneNum').value);save();openApp('전화')">기록 추가</button></div>${data.calls.map(c=>`<div class="listitem">📞 ${esc(c)}</div>`).join('')}`;
 if(n==='음악')return `<div class="card"><h3>♫ 나만의 음악</h3><p>기분에 맞는 음악을 상상해 봐 🎧</p><button class="primary" onclick="alert('이 앱은 가상 화면이야. 실제 음악 재생은 지원하지 않아!')">재생 ▶</button></div>`;
 if(n==='지도')return `<div class="card"><b>장소 찾기</b><input id="mapQ" placeholder="가고 싶은 곳"><button class="primary" onclick="window.open('https://www.google.com/maps/search/'+encodeURIComponent(document.getElementById('mapQ').value),'_blank')">지도에서 보기</button></div>`;
 if(n==='지갑')return `<div class="card"><b>가상 지갑</b><p>실제 결제나 카드 정보는 저장하지 않아.</p><input placeholder="카드 별명"><button class="primary" onclick="alert('가상 카드 기능이야!')">카드 추가</button></div>`;
 if(n==='음성 메모')return `<div class="card"><b>음성 메모</b><p>이 앱 화면에서는 녹음 기능을 제공하지 않아.</p><input placeholder="녹음 제목"><button class="primary" onclick="alert('제목만 기록하는 가상 기능이야!')">확인</button></div>`;
 if(n==='파일')return `<div class="card"><b>내 파일</b><p>백업은 설정 앱에서 저장할 수 있어.</p><button class="primary" onclick="downloadBackup()">백업 JSON 다운로드</button></div>`;
 if(n==='App Store')return `<div class="card"><b>앱 스토어</b><p>여기는 가상 앱 스토어야. 앱 설치는 실제로 되지 않아.</p></div>`;
 if(n==='디스코드')return `<div class="card"><b>가상 서버</b><p>친구들과 이야기하는 공간을 상상해 봐 💜</p><input placeholder="메시지"><button class="primary" onclick="alert('가상 화면이라 실제 전송은 안 돼!')">보내기</button></div>`;
 return `<div class="card"><b>${esc(n)}</b><p>이 앱은 가상 아이폰을 꾸미기 위한 모형이야.</p></div>`;
}
function doSearch(n){let q=document.getElementById('searchQ').value.trim();if(!q)return;data.searches.unshift(q);data.searches=[...new Set(data.searches)].slice(0,30);save();if(n==='Safari')window.open('https://www.google.com/search?q='+encodeURIComponent(q),'_blank');openApp(n)}
function addVideo(){let q=document.getElementById('videoQ').value.trim();if(q){data.videos.unshift(q);save();openApp('유튜브')}}
function makeChat(){let q=document.getElementById('chatName').value.trim();if(q){data.messages.push({name:q,text:''});save();openApp('카카오톡')}}
function sendMsg(i){let q=document.getElementById('msg'+i).value.trim();if(q){data.messages[i].text=q;save();openApp('카카오톡')}}
function addPost(){let q=document.getElementById('postText').value.trim();if(q){data.posts.unshift(q);save();openApp('인스타그램')}}
function addNote(){let q=document.getElementById('noteText').value.trim();if(q){data.notes.unshift(q);save();openApp('메모')}}
function addReminder(){let q=document.getElementById('remText').value.trim();if(q){data.reminders.push({text:q,date:document.getElementById('remDate').value||'날짜 미정'});save();openApp('미리 알림')}}
function addPhotos(e){[...e.target.files].forEach(f=>{let r=new FileReader();r.onload=()=>{data.photos.unshift(r.result);save();openApp('사진')};r.readAsDataURL(f)})}
function downloadBackup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='my-little-iphone-backup.json';a.click();URL.revokeObjectURL(a.href)}
function restoreBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{data={...data,...JSON.parse(r.result)};save();renderHome();alert('복원했어!')}catch(err){alert('파일을 읽을 수 없어.')}};r.readAsText(f)}
renderHome();
</script>
</body>
</html>
