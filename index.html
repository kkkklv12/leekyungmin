
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>My iPhone</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Arial",sans-serif;background:#dce6f5;color:#222}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}
#phone{width:100%;max-width:430px;min-height:100dvh;margin:auto;background:#f5f5f7;position:relative;overflow:hidden}
.status{height:35px;padding:10px 25px 0;display:flex;justify-content:space-between;font-size:13px;font-weight:bold;position:relative;z-index:2}
#screen{min-height:calc(100dvh - 35px);padding-bottom:25px}
.home{min-height:calc(100dvh - 35px);padding:25px 20px;background:var(--wall);background-size:cover;background-position:center;position:relative}
.welcome{color:white;text-shadow:0 1px 5px #555;margin:15px 0 28px}
.clock{font-size:48px;font-weight:300}
.date{font-size:15px}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:24px 8px}
.app{display:flex;flex-direction:column;align-items:center;gap:5px;color:white;text-decoration:none;font-size:11px;text-shadow:0 1px 3px #444;min-width:0}
.appicon{width:58px;height:58px;border-radius:15px;background:white;display:grid;place-items:center;font-size:30px;text-shadow:none;box-shadow:0 3px 8px #0002}
.dock{position:absolute;bottom:22px;left:15px;right:15px;background:#ffffff55;backdrop-filter:blur(18px);border-radius:25px;padding:12px;display:flex;justify-content:space-around}
.dock .appicon{width:52px;height:52px}
.page{background:#f5f5f7;min-height:calc(100dvh - 35px);padding-bottom:30px}
.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #ddd}
.top h2{font-size:19px;margin:0}
.back{font-size:16px;color:#1684ff;background:none;padding:8px 0}
.content{padding:18px}
.muted{color:#888;font-size:13px}
.group{background:white;border-radius:14px;overflow:hidden;margin:12px 0}
.item{padding:15px;border-bottom:1px solid #eee;display:flex;align-items:center;gap:12px}
.item:last-child{border-bottom:0}
.item button{margin-left:auto;background:#e9f2ff;color:#1675e8;border-radius:10px;padding:8px}
.item .sub{font-size:12px;color:#888;margin-top:4px}
.field{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;background:white;margin:5px 0 12px;outline-color:#1684ff}
.primary{background:#1684ff;color:white;padding:13px;border-radius:12px;width:100%;margin:5px 0}
.secondary{background:#e7e7eb;color:#222;padding:11px;border-radius:10px}
.chat{padding:12px;border-radius:16px;background:white;margin:10px 0;max-width:85%;overflow-wrap:anywhere}
.mine{margin-left:auto;background:#a9e77c}
.chatname{font-size:12px;color:#777;margin:8px 0}
.bubble{display:flex;flex-direction:column}
.note{width:100%;height:45vh;resize:vertical;border:0;background:#fff7cc;border-radius:12px;padding:16px;line-height:1.7}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.photo{aspect-ratio:1;background:#ddd;display:grid;place-items:center;font-size:40px}
.profile{width:76px;height:76px;border-radius:50%;background:#ddd;display:grid;place-items:center;font-size:38px;margin:8px auto}
hr{border:0;border-top:1px solid #eee}
.small{font-size:12px;color:#888}
</style>
</head>
<body>
<div id="phone">
  <div class="status"><span id="statusTime">9:41</span><span>●●●　 Wi-Fi　 ▰</span></div>
  <main id="screen"></main>
</div>
<script>
const VIDEO="https://youtu.be/0aRTVe-Vnvk?si=ZPWyYzXEAb9MmWdw";
const $=s=>document.querySelector(s);
const defaults={
 wallpaper:"linear-gradient(145deg,#9bb9e8,#d6b9e8,#f5c8d7)",
 profile:"나",emoji:"🌷",theme:"#1684ff",
 contacts:[{name:"경민",phone:"010-1234-5678"},{name:"친구",phone:"010-9876-5432"}],
 calls:[],messages:[],chats:[],searches:[],notes:"오늘의 메모 ✍️",
 posts:[],queries:""
};
let data;
try{data={...defaults,...JSON.parse(localStorage.getItem("myPhone")||"{}")}}catch(e){data={...defaults}}
let current="홈";
function save(){localStorage.setItem("myPhone",JSON.stringify(data))}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function top(title){return `<div class="top"><button class="back" data-action="home">‹ 홈</button><h2>${title}</h2><span style="width:30px"></span></div>`}
function app(icon,name,link){
 if(link)return `<a class="app" href="${link}"><span class="appicon">${icon}</span><span>${name}</span></a>`;
 return `<button class="app" data-app="${name}"><span class="appicon">${icon}</span><span>${name}</span></button>`
}
function home(){
 $("#screen").innerHTML=`<section class="home" style="--wall:${data.wallpaper}">
 <div class="welcome"><div class="date" id="date"></div><div class="clock" id="clock"></div><div>${esc(data.profile)}의 iPhone ✨</div></div>
 <div class="apps">
 ${app("📞","전화")}${app("💬","메시지")}${app("🗨️","카카오톡")}${app("📷","인스타그램")}
 ${app("🔍","네이버")}${app("▶️","YouTube",VIDEO)}${app("🖼️","사진")}${app("📝","메모")}
 ${app("⚙️","설정")}${app("👤","프로필")}
 </div>
 <div class="dock">${app("📞","전화")}${app("💬","메시지")}${app("🧭","네이버")}${app("⚙️","설정")}</div>
 </section>`;
 updateClock()
}
function page(title,body){$("#screen").innerHTML=`<section class="page">${top(title)}<div class="content">${body}</div></section>`}
function openApp(name){
 current=name;
 if(name==="홈"){home();return}
 if(name==="전화"){
 page("전화",`<h3>최근 통화</h3><div class="group">${data.calls.length?data.calls.map((c,i)=>`<div class="item"><span>📞</span><div>${esc(c.name)}<div class="sub">${esc(c.phone)} · ${esc(c.time)}</div></div><button data-action="delCall" data-i="${i}">삭제</button></div>`).join(""):'<div class="item muted">최근 통화가 없습니다.</div>'}</div>
 <h3>연락처</h3><div class="group">${data.contacts.map(c=>`<div class="item"><span>👤</span><div>${esc(c.name)}<div class="sub">${esc(c.phone)}</div></div><button data-action="call" data-name="${esc(c.name)}" data-phone="${esc(c.phone)}">통화</button></div>`).join("")}</div>
 <h3>연락처 추가</h3><input id="contactName" class="field" placeholder="이름"><input id="contactPhone" class="field" placeholder="전화번호" inputmode="tel"><button class="primary" data-action="addContact">추가하기</button>`);
 }else if(name==="메시지"){
 page("메시지",`<h3>메시지</h3><div class="group">${data.messages.length?data.messages.map((m,i)=>`<div class="item"><span>💬</span><div>${esc(m.name)}<div class="sub">${esc(m.text)}</div></div><button data-action="delMessage" data-i="${i}">삭제</button></div>`).join(""):'<div class="item muted">메시지가 없습니다.</div>'}</div>
 <input id="msgName" class="field" placeholder="받는 사람"><textarea id="msgText" class="field" placeholder="메시지를 입력해 줘"></textarea><button class="primary" data-action="sendMessage">메시지 보내기</button>`);
 }else if(name==="카카오톡"){
 page("카카오톡",`<h3>채팅</h3><div class="group">${data.chats.length?data.chats.map((c,i)=>`<div class="item"><span>🟡</span><div>${esc(c.name)}<div class="sub">${esc(c.text)}</div></div><button data-action="delChat" data-i="${i}">삭제</button></div>`).join(""):'<div class="item muted">아직 채팅이 없습니다.</div>'}</div>
 <input id="chatName" class="field" placeholder="친구 이름"><textarea id="chatText" class="field" placeholder="채팅 내용"></textarea><button class="primary" data-action="sendChat">채팅 추가하기</button><p class="muted">가상 채팅 화면이에요. 실제 카카오톡으로 전송되지는 않아요.</p>`);
 }else if(name==="인스타그램"){
 page("Instagram",`<div class="item"><div class="profile">${esc(data.emoji)}</div><div><b>${esc(data.profile)}</b><div class="sub">가상 계정 · 게시물 ${data.posts.length}개</div></div></div>
 <input id="postText" class="field" placeholder="오늘은 무슨 일이 있었나요?"><button class="primary" data-action="addPost">게시하기</button><h3>피드</h3>${data.posts.length?data.posts.slice().reverse().map((p,i)=>`<div class="group"><div class="item">🌷 ${esc(data.profile)}</div><div style="padding:15px">${esc(p)}</div><div class="item"><button data-action="delPost" data-i="${data.posts.length-1-i}">삭제</button></div></div>`).join(""):'<p class="muted">아직 게시물이 없습니다.</p>'}<p class="muted">가상 인스타그램이에요. 실제 계정에는 게시되지 않아요.</p>`);
 }else if(name==="네이버"){
 page("NAVER",`<div style="font-size:32px;text-align:center;color:#03c75a;font-weight:bold;margin:20px">NAVER</div><input id="searchText" class="field" placeholder="검색어를 입력하세요" value="${esc(data.queries)}"><button class="primary" data-action="search">검색하기</button><h3>최근 검색 기록</h3><div class="group">${data.searches.length?data.searches.slice().reverse().map((s,i)=>`<div class="item">🔍 ${esc(s)}<button data-action="searchAgain" data-value="${esc(s)}">검색</button><button data-action="delSearch" data-i="${data.searches.length-1-i}">×</button></div>`).join(""):'<div class="item muted">검색 기록이 없습니다.</div>'}</div><button class="secondary" data-action="clearSearch">기록 전체 삭제</button>`);
 }else if(name==="사진"){
 page("사진",`<h3>나의 앨범</h3><p class="muted">가상 사진 앨범</p><div class="photo-grid">${["🌅","🌸","🐈","🌈","🌷","🌙","☁️","🧸","💗"].map(x=>`<div class="photo">${x}</div>`).join("")}</div><p class="muted">사진은 예시 이모지로 표시돼요.</p>`);
 }else if(name==="메모"){
 page("메모",`<h3>나의 메모</h3><textarea id="noteText" class="note">${esc(data.notes)}</textarea><button class="primary" data-action="saveNote">메모 저장</button><p class="muted">저장하면 다음에 다시 열어도 내용이 남아요.</p>`);
 }else if(name==="설정"){
 page("설정",`<div class="group"><div class="item">👤 <div>프로필 설정<div class="sub">이름과 이모지 변경</div></div></div><div style="padding:15px"><label>이름</label><input id="profileName" class="field" value="${esc(data.profile)}"><label>프로필 이모지</label><input id="profileEmoji" class="field" value="${esc(data.emoji)}"></div></div>
 <div class="group"><div class="item">🖼️ 배경화면</div><div style="padding:15px"><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${[
 ["하늘","linear-gradient(145deg,#9bb9e8,#d6b9e8,#f5c8d7)"],
 ["분홍","linear-gradient(145deg,#fbc2eb,#a6c1ee)"],
 ["바다","linear-gradient(145deg,#89f7fe,#66a6ff)"],
 ["노을","linear-gradient(145deg,#f6d365,#fda085)"],
 ["초록","linear-gradient(145deg,#d4fc79,#96e6a1)"],
 ["밤","linear-gradient(145deg,#232526,#414345)"]
 ].map((w,i)=>`<button data-action="wall" data-value="${i}" style="height:65px;border-radius:12px;background:${w[1]};color:${i===5?'white':'#333'}">${w[0]}</button>`).join("")}</div></div></div>
 <button class="primary" data-action="saveProfile">설정 저장</button><hr><h3>데이터</h3><button class="secondary" data-action="reset">가상 휴대폰 초기화</button>`);
 }else if(name==="프로필"){
 page("프로필",`<div class="profile">${esc(data.emoji)}</div><h2 style="text-align:center">${esc(data.profile)}</h2><p class="muted" style="text-align:center">나만의 가상 아이폰</p><button class="primary" data-app="설정">프로필 수정하기</button>`);
 }else{home()}
}
function updateClock(){
 const d=new Date();
 const c=$("#clock"),date=$("#date"),st=$("#statusTime");
 if(c)c.textContent=d.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",hour12:false});
 if(date)date.textContent=d.toLocaleDateString("ko-KR",{month:"long",day:"numeric",weekday:"long"});
 if(st)st.textContent=d.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",hour12:false});
}
document.addEventListener("click",e=>{
 const a=e.target.closest("[data-app]");
 if(a){openApp(a.dataset.app);return}
 const b=e.target.closest("[data-action]");
 if(!b)return;
 const act=b.dataset.action,i=Number(b.dataset.i);
 if(act==="home"){home();return}
 if(act==="addContact"){
 const name=$("#contactName").value.trim(),phone=$("#contactPhone").value.trim();
 if(!name||!phone){alert("이름과 전화번호를 입력해 줘!");return}
 data.contacts.push({name,phone});save();openApp("전화");
 }else if(act==="call"){
 data.calls.unshift({name:b.dataset.name,phone:b.dataset.phone,time:new Date().toLocaleString("ko-KR")});save();alert(b.dataset.name+"에게 가상 통화를 걸었어요!");openApp("전화");
 }else if(act==="delCall"){data.calls.splice(i,1);save();openApp("전화")}
 else if(act==="sendMessage"){
 const name=$("#msgName").value.trim(),text=$("#msgText").value.trim();
 if(!name||!text){alert("받는 사람과 메시지를 입력해 줘!");return}
 data.messages.push({name,text});save();openApp("메시지");
 }else if(act==="delMessage"){data.messages.splice(i,1);save();openApp("메시지")}
 else if(act==="sendChat"){
 const name=$("#chatName").value.trim(),text=$("#chatText").value.trim();
 if(!name||!text){alert("이름과 채팅 내용을 입력해 줘!");return}
 data.chats.push({name,text});save();openApp("카카오톡");
 }else if(act==="delChat"){data.chats.splice(i,1);save();openApp("카카오톡")}
 else if(act==="addPost"){
 const p=$("#postText").value.trim();if(!p){alert("게시물 내용을 입력해 줘!");return}
 data.posts.push(p);save();openApp("인스타그램");
 }else if(act==="delPost"){data.posts.splice(i,1);save();openApp("인스타그램")}
 else if(act==="search"||act==="searchAgain"){
 const q=act==="search"?$("#searchText").value.trim():b.dataset.value;
 if(!q){alert("검색어를 입력해 줘!");return}
 data.queries=q;data.searches.push(q);save();
 window.open("https://search.naver.com/search.naver?query="+encodeURIComponent(q),"_blank");
 openApp("네이버");
 }else if(act==="delSearch"){data.searches.splice(i,1);save();openApp("네이버")}
 else if(act==="clearSearch"){data.searches=[];save();openApp("네이버")}
 else if(act==="saveNote"){data.notes=$("#noteText").value;save();alert("메모를 저장했어요!")}
 else if(act==="wall"){
 const walls=[
 "linear-gradient(145deg,#9bb9e8,#d6b9e8,#f5c8d7)",
 "linear-gradient(145deg,#fbc2eb,#a6c1ee)",
 "linear-gradient(145deg,#89f7fe,#66a6ff)",
 "linear-gradient(145deg,#f6d365,#fda085)",
 "linear-gradient(145deg,#d4fc79,#96e6a1)",
 "linear-gradient(145deg,#232526,#414345)"
 ];data.wallpaper=walls[Number(b.dataset.value)];save();openApp("설정");
 }else if(act==="saveProfile"){
 data.profile=$("#profileName").value.trim()||"나";
 data.emoji=$("#profileEmoji").value.trim()||"🌷";save();alert("프로필을 저장했어요!");openApp("설정");
 }else if(act==="reset"){
 if(confirm("저장한 가상 데이터를 모두 초기화할까요?")){
 localStorage.removeItem("myPhone");data={...defaults,contacts:defaults.contacts.map(x=>({...x})),calls:[],messages:[],chats:[],searches:[],posts:[]};save();home();
 }
 }
});
home();
setInterval(updateClock,1000);
</script>
</body>
</html>
